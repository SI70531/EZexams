# Downloads the web fonts into assets/fonts and points the pages at them (tools/fonts.py). Run it by hand
# (Actions → Self-host fonts → Run workflow) or by changing tools/fonts.py.
name: Self-host fonts
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fonts:
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 tools/fonts.py
      - run: python3 tools/stamp.py
      - name: Commit
        run: |
          git add -A assets/fonts *.html */midterm/index.html
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Self-host web fonts (tools/fonts.py)"
            git pull --rebase
            git push
          fi
