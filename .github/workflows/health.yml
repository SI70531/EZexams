# Daily check of the Worker's secrets and of errors reported by visitors' browsers.
# - fails (and GitHub emails you) when GITHUB_TOKEN is invalid or expires within 14 days, or GEMINI_KEY stops working
# - opens (or adds to) the issue "網站錯誤回報" when pages reported errors in the last 24 hours
name: Health check
on:
  schedule:
    - cron: "23 1 * * *"   # 09:23 Taipei
  workflow_dispatch:
permissions:
  issues: write
jobs:
  health:
    runs-on: ubuntu-latest
    env:
      WORKER: https://ezexams-ai.ta77199ta.workers.dev
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Secrets still good?
        run: |
          set -e
          h=$(curl -fsS "$WORKER/health")
          echo "$h" | jq .
          gh_ok=$(echo "$h" | jq -r '.github.ok'); days=$(echo "$h" | jq -r '.github.daysLeft // "none"'); gm_ok=$(echo "$h" | jq -r '.gemini.ok')
          bad=0
          if [ "$gh_ok" != "true" ]; then echo "::error::GITHUB_TOKEN 無效或已過期，雲端同步會停。請到 GitHub 重新產生 token（只勾 gist），再到 Cloudflare Worker 的 Variables and Secrets 更新 GITHUB_TOKEN。"; bad=1; fi
          if [ "$days" != "none" ] && [ "$days" -lt 14 ]; then echo "::error::GITHUB_TOKEN 剩 $days 天就到期（$(echo "$h" | jq -r .github.expires)）。請盡快換新的。"; bad=1; fi
          if [ "$gm_ok" != "true" ]; then echo "::error::GEMINI_KEY 無法使用（HTTP $(echo "$h" | jq -r .gemini.status)），AI 批改會改用關鍵字。請到 Google AI Studio 檢查金鑰，再更新 Worker 的 GEMINI_KEY。"; bad=1; fi
          [ "$days" != "none" ] && echo "::notice::GITHUB_TOKEN 還有 $days 天到期"
          exit $bad
      - name: Errors from visitors' browsers (last 24 h)
        if: always()
        run: |
          since=$(( ($(date +%s) - 86400) * 1000 ))
          e=$(curl -fsS "$WORKER/errors?since=$since" || echo '{"errors":[]}')
          n=$(echo "$e" | jq '.errors | length')
          echo "errors in the last 24 h: $n"
          [ "$n" = "0" ] && exit 0
          body=$(echo "$e" | jq -r '.errors[] | "- **\(.msg)** — `\(.src)` on `\(.page)`, \(.n) 次（最後 \(.last/1000|todate)）"')
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "網站錯誤回報 in:title" --json number -q '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$(date -u +%F) 新的錯誤：
          $body"
          else gh issue create -R "$GITHUB_REPOSITORY" --title "網站錯誤回報" --body "訪客瀏覽器回報的錯誤（每天自動整理）：
          $body"; fi
