# Runs tests/run.mjs (site + Worker checks in a headless browser, no network) only when started by hand (Actions > Tests > Run workflow),
# so a push never sends a failure e-mail. Optional input `only` runs just the checks whose name matches it.
name: Tests
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Only run checks whose name matches this regex (empty = all)"
        required: false
        default: ""
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Run checks
        env:
          ONLY: ${{ inputs.only }}
        run: node tests/run.mjs
