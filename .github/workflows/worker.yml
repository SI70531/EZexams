# Deploys the EZexams Worker (tools/ezexams-worker.js + tools/wrangler.toml) to Cloudflare.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own secrets (GEMINI_KEY, GITHUB_TOKEN) stay in Cloudflare and are not touched.
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/ezexams-worker.js", "tools/wrangler.toml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip when Cloudflare is not set up yet
        if: env.HAS_TOKEN != 'true'
        run: echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the Worker."
      - uses: cloudflare/wrangler-action@v3
        if: env.HAS_TOKEN == 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: tools
