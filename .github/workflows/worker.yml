# Deploys the EZexams Worker (tools/ezexams-worker.js + tools/wrangler.toml) to Cloudflare.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (template "Edit Cloudflare Workers") and CLOUDFLARE_ACCOUNT_ID.
# The Worker's own secrets (GEMINI_KEY, SUPABASE_SECRET_KEY) stay in Cloudflare and are not touched.
name: Deploy Worker
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/ezexams-worker.js", "tools/wrangler.toml", ".github/workflows/worker.yml"]
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Skip when Cloudflare is not set up yet
        if: env.HAS_TOKEN != 'true'
        run: echo "Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to deploy the Worker."
      - name: Deploy with Wrangler
        if: env.HAS_TOKEN == 'true'
        working-directory: tools
        run: |
          set -o pipefail
          if ! npx --yes wrangler@4 deploy 2>&1 | tee deploy.log; then
            # show Wrangler's own error lines as annotations, so they are visible without the full log
            grep -E "ERROR|✘|error|Error|code:" deploy.log | head -20 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          fi
          grep -E "https://.*workers.dev|Current Version ID" deploy.log | while IFS= read -r l; do echo "::notice::$l"; done
