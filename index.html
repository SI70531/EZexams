<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EZexams 考試衝刺</title>
<style>
:root{--bg:#f5f7fb;--paper:#fff;--ink:#18213a;--muted:#5d6782;--line:#d8deea;--accent:#2457c5;--accent-soft:#e7eefc}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151f;--paper:#181e2b;--ink:#e4e8f2;--muted:#9aa4bd;--line:#2c3447;--accent:#7ea4ff;--accent-soft:#1f2b48}}
:root[data-theme="dark"]{--bg:#11151f;--paper:#181e2b;--ink:#e4e8f2;--muted:#9aa4bd;--line:#2c3447;--accent:#7ea4ff;--accent-soft:#1f2b48}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:40px 16px 60px}
h1{font-size:28px;margin:0 0 4px}
.sub{color:var(--muted);margin:0 0 28px}
h2{font-size:15px;color:var(--muted);font-weight:600;margin:28px 0 10px;letter-spacing:.04em}
.card{display:block;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}
.card b{font-size:18px;color:var(--accent)}
.card span{display:block;color:var(--muted);font-size:14px;margin-top:2px}
.soon{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main>
<h1>EZexams</h1>
<p class="sub">各科考前衝刺：白話講義、選擇題、考古題和模擬試題。</p>

<h2>作業系統 Operating Systems</h2>
<a class="card" href="operating-systems/midterm/">
  <b>期中考衝刺</b>
  <span>Silberschatz 9th Ch1–Ch5・章末選擇題・去年考古題・模擬試題 A / B（可作答自動批改）</span>
</a>

<p class="soon">其他科目陸續加入。</p>
</main>
</body>
</html>
